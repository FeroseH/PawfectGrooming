<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Services | Pawfect Grooming</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

<link rel="stylesheet" href="../customer-new.css"></head>


<body class="dashboard-page services-page">
    <!-- =========================
         HEADER
    ========================== -->

    

<header class="dashboard-header">

    <div class="dashboard-brand">
        <h2>Pawfect Grooming</h2>
        <small>Gentle care. Happy pets.</small>
    </div>

    <button
        type="button"
        class="dashboard-menu-toggle"
        id="dashboardMenuToggle"
        aria-label="Open navigation menu"
        aria-controls="dashboardMenuPanel"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="dashboard-menu-panel" id="dashboardMenuPanel">
        <nav class="dashboard-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="pets.html">My Pets</a>
            <a href="services.html" class="active">Services</a>
            <a href="appointments.html">Appointments</a>
            <a href="checkout.html">Checkout</a>
            <a href="history.html">History</a>
            <a href="account.html">Account</a>
        </nav>

        <button id="logoutButton" class="logout-button" type="button">
            Log Out
        </button>
    </div>

</header>

<div class="dashboard-menu-overlay" id="dashboardMenuOverlay"></div>




    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="dashboard-container services-page-container">


        <!-- PAGE HEADING -->

        <section class="services-page-heading">

            <div>

                <p class="small-label">
                    GENTLE CARE FOR YOUR PET
                </p>

                <h1>
                    Grooming Services
                </h1>

                <p>
                    Choose the grooming service that best
                    suits your furry friend's needs.
                </p>

            </div>


            

        </section>


        <!-- =========================
             SERVICES
        ========================== -->

        <section class="services-section">

            <div class="section-heading">

                <div>

                    <h2>
                        Available Services
                    </h2>

                    <p id="serviceCount">
                        Loading services...
                    </p>

                </div>

            </div>


            <div
                id="servicesList"
                class="services-grid"
            >

                <div class="loading-state">
                    Loading grooming services...
                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         SUPABASE
    ========================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase client configuration -->
<script src="../js/supabase.js"></script>

<!-- Shared toast notifications -->
<script src="../js/toast.js"></script>

<!-- Authentication functions -->
<script src="../js/auth.js"></script>

<!-- Shared logout confirmation -->
<script src="../js/logout.js"></script>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let currentUser = null;


        const servicesList =
            document.getElementById("servicesList");

        const serviceCount =
            document.getElementById("serviceCount");

        const logoutButton =
            document.getElementById("logoutButton");


        /* =========================
           LOAD USER
        ========================== */

        
async function loadUser() {
    try {
        console.log("Services page: checking authentication...");

        if (typeof supabaseClient === "undefined") {
            throw new Error(
                "supabaseClient is not defined. Check ../js/supabase.js."
            );
        }

        const { data, error } =
            await supabaseClient.auth.getUser();

        if (error) {
            throw error;
        }

        if (!data.user) {
            window.location.href = "../login.html";
            return;
        }

        currentUser = data.user;

        console.log("Services page: user authenticated.");
        console.log("Services page: loading services...");

        await loadServices();

        console.log("Services page: loading finished.");

    } catch (error) {
        console.error("SERVICES PAGE ERROR:", error);

        serviceCount.textContent = "Unable to load services.";

        servicesList.innerHTML = `
            <div class="empty-services">
                <p>
                    Something went wrong while loading services.
                    Please refresh the page and try again.
                </p>
            </div>
        `;
    }
}



        /* =========================
           LOAD SERVICES
        ========================== */

        async function loadServices() {

            servicesList.innerHTML = `
                <div class="loading-state">
                    Loading grooming services...
                </div>
            `;


            const {
                data: services,
                error
            } = await supabaseClient

                .from("services")

                .select("*")

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(
                    "LOAD SERVICES ERROR:",
                    error
                );


                serviceCount.textContent =
                    "Unable to load services.";


                servicesList.innerHTML = `
                    <div class="empty-services">
                        <p>
                            We couldn't load the grooming services.
                        </p>
                    </div>
                `;

                return;
            }


            /* =========================
               NO SERVICES
            ========================== */

            if (
                !services ||
                services.length === 0
            ) {

                serviceCount.textContent =
                    "No services available.";


                servicesList.innerHTML = `
                    <div class="empty-services">
                        <p>
                            There are currently no grooming services available.
                        </p>
                    </div>
                `;

                return;
            }


            /* =========================
               SERVICE COUNT
            ========================== */

            serviceCount.textContent =
                services.length === 1
                    ? "1 service available"
                    : `${services.length} services available`;


            servicesList.innerHTML = "";


            /* =========================
               CREATE SERVICE CARDS
            ========================== */

            services.forEach(
                function (service) {

                    const serviceCard =
                        document.createElement(
                            "div"
                        );


                    serviceCard.className =
                        "service-card";


                    serviceCard.classList.add(
                        "service-card--tier-" +
                        getPriceTier(service.price)
                    );


                    serviceCard.innerHTML = `

                        


                        <div class="service-card-content">

                            <h3>
                                ${escapeHTML(service.name)}
                            </h3>

                            <p class="service-description">
                                ${
                                    escapeHTML(
                                        service.description ||
                                        "Professional grooming care for your pet."
                                    )
                                }
                            </p>


                            <div class="service-details">

                                <span>
                                    
                                    ${service.duration} minutes
                                </span>

                                <strong>
                                    ₱${formatPrice(service.price)}
                                </strong>

                            </div>


                            <button
                                type="button"
                                class="book-service-button"
                                data-service-id="${service.id}"
                            >
                                Book This Service
                            </button>

                        </div>

                    `;


                    servicesList.appendChild(
                        serviceCard
                    );


                    /* =========================
                       BOOK BUTTON
                    ========================== */

                    const bookButton =
                        serviceCard.querySelector(
                            ".book-service-button"
                        );


                    bookButton.addEventListener(
                        "click",
                        function () {

                            const serviceId =
                                this.dataset.serviceId;


                            window.location.href =
                                `appointments.html?service=${serviceId}`;

                        }
                    );

                }
            );

        }


        /* =========================
   SERVICE ICON (NO EMOJIS)
========================= */

function getServiceIcon(name) {
    const serviceName = name.toLowerCase();

    if (serviceName.includes("bath")) {
        return "";
    }

    if (serviceName.includes("groom")) {
        return "icon-groom";
    }

    if (serviceName.includes("nail")) {
        return "icon-nail";
    }

    if (serviceName.includes("ear")) {
        return "icon-ear";
    }

    return "icon-pet";
}

        


        /* =========================
           PRICE TIERS
        ========================== */

        const SERVICE_TIER_1_MAX = 250;
        const SERVICE_TIER_2_MAX = 500;

        function getPriceTier(price) {

            const value = Number(price);

            if (!Number.isFinite(value) || value < 0) {
                return 1;
            }

            if (value <= SERVICE_TIER_1_MAX) {
                return 1;
            }

            if (value <= SERVICE_TIER_2_MAX) {
                return 2;
            }

            return 3;

        }


        /* =========================
           FORMAT PRICE
        ========================== */

        function formatPrice(price) {

            return Number(price).toLocaleString(
                "en-PH",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

        }


        /* =========================
           ESCAPE HTML
        ========================== */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        


        /* =========================
           START
        ========================== */

        loadUser();

    </script>


<script>
(function () {
    const page = document.querySelector(".services-page");
    const toggle = document.getElementById("dashboardMenuToggle");
    const overlay = document.getElementById("dashboardMenuOverlay");
    const panel = document.getElementById("dashboardMenuPanel");

    if (!page || !toggle || !overlay || !panel) return;

    function openMenu() {
        page.classList.add("menu-open");
        toggle.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-label", "Close navigation menu");
    }

    function closeMenu() {
        page.classList.remove("menu-open");
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Open navigation menu");
    }

    toggle.addEventListener("click", function () {
        if (toggle.getAttribute("aria-expanded") === "true") {
            closeMenu();
        } else {
            openMenu();
        }
    });

    overlay.addEventListener("click", closeMenu);

    panel.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeMenu();
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 768) closeMenu();
    });
})();
</script>

</body>

</html>
