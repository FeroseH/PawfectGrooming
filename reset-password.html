
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Pawfect Grooming</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <!-- LEFT SIDE -->
        <section class="auth-visual">
            <div class="auth-visual-content">

                <a href="index.html" class="auth-logo">
                    Pawfect Grooming
                </a>

                <div class="auth-message">
                    <h1>
                        A new password.<br>
                        A fresh start.
                    </h1>

                    <p>
                        Keep your account secure and get back
                        to caring for your furry friends.
                    </p>
                </div>

            </div>
        </section>

        <!-- RIGHT SIDE -->
        <section class="auth-form-section">
            <div class="auth-form-container">

                <a href="index.html" class="mobile-auth-logo">
                    Pawfect Grooming
                </a>

                <div class="auth-heading">
                    <span class="auth-small-title">
                        ACCOUNT RECOVERY
                    </span>

                    <h2>Reset your password</h2>

                    <p>
                        Choose a new password for your account.
                    </p>
                </div>

                <form id="resetPasswordForm" class="auth-form">

                    <!-- NEW PASSWORD -->
                    <div class="form-group">
                        <label for="newPassword">
                            New Password
                        </label>

                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                placeholder="Enter your new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="newPassword"
                                aria-label="Show new password"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">
                        <label for="confirmNewPassword">
                            Confirm New Password
                        </label>

                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="confirmNewPassword"
                                name="confirmNewPassword"
                                placeholder="Confirm your new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                data-target="confirmNewPassword"
                                aria-label="Show confirm password"
                                aria-pressed="false"
                            >
                                Show
                            </button>
                        </div>
                    </div>

                    <p class="reset-password-hint">
                        Use at least 8 characters.
                    </p>

                    <button
                        type="submit"
                        id="resetPasswordButton"
                        class="auth-button"
                    >
                        Save New Password
                    </button>

                    <p
                        id="resetPasswordMessage"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>

                <p class="auth-back">
                    <a href="login.html">← Back to Log In</a>
                </p>

            </div>
        </section>

    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/toast.js"></script>

    <!-- RESET PASSWORD LOGIC -->
    <script>
        const resetForm = document.getElementById("resetPasswordForm");
        const newPassword = document.getElementById("newPassword");
        const confirmNewPassword = document.getElementById("confirmNewPassword");
        const resetMessage = document.getElementById("resetPasswordMessage");
        const resetButton = document.getElementById("resetPasswordButton");

        let recoverySessionReady = false;

        function showMessage(message, isError = false) {
            resetMessage.textContent = message;
            resetMessage.style.color = isError ? "#b42318" : "#426844";
        }

        // Show or hide password fields
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === "password";

                input.type = isHidden ? "text" : "password";
                button.textContent = isHidden ? "Hide" : "Show";
                button.setAttribute("aria-pressed", String(isHidden));

                const label = input.id === "newPassword"
                    ? "new password"
                    : "confirm password";

                button.setAttribute(
                    "aria-label",
                    `${isHidden ? "Hide" : "Show"} ${label}`
                );
            });
        });

        // Supabase recovery links may establish a session from
        // the URL fragment. Never allow updates without that session.
        async function initializeRecovery() {
            try {
                const hashParams = new URLSearchParams(
                    window.location.hash.substring(1)
                );

                const queryParams = new URLSearchParams(
                    window.location.search
                );

                if (
                    hashParams.get("error") ||
                    queryParams.get("error")
                ) {
                    throw new Error(
                        "This reset link is invalid or expired. Request a new one."
                    );
                }

                const {
                    data: { session },
                    error
                } = await supabaseClient.auth.getSession();

                if (error) throw error;

                if (!session) {
                    throw new Error(
                        "No recovery session was found. Please open the latest reset link from your email."
                    );
                }

                recoverySessionReady = true;
            } catch (error) {
                console.error("Recovery session error:", error);

                showMessage(
                    error.message ||
                    "Unable to verify your reset link. Please request a new one.",
                    true
                );

                resetButton.disabled = true;
            }
        }

        // Save the new password
        resetForm.addEventListener("submit", async event => {
            event.preventDefault();

            if (!recoverySessionReady) {
                showMessage(
                    "Your reset link hasn't been verified. Please request a new one.",
                    true
                );
                return;
            }

            if (newPassword.value.length < 8) {
                showMessage(
                    "Your password must be at least 8 characters long.",
                    true
                );
                return;
            }

            if (newPassword.value !== confirmNewPassword.value) {
                showMessage("Your passwords do not match.", true);
                confirmNewPassword.focus();
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Saving...";
            showMessage("");

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword.value
                });

                if (error) throw error;

                showMessage(
                    "Your password has been updated. Redirecting to login..."
                );

                resetForm.reset();

                // End the recovery session after a successful update.
                await supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1800);

            } catch (error) {
                console.error("Password update error:", error);

                showMessage(
                    error.message ||
                    "We couldn't update your password. Please try again.",
                    true
                );
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Save New Password";
            }
        });

        initializeRecovery();
    </script>

</body>
</html>
