
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Pawfect Grooming</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-visual">
            <div class="auth-visual-content">
                <a href="index.html" class="auth-logo">Pawfect Grooming</a>
                <div class="auth-message">
                    <h1>One more step.<br>Then you're in.</h1>
                    <p>Verify your email to keep your Pawfect Grooming account secure.</p>
                </div>
            </div>
        </section>

        <section class="auth-form-section">
            <div class="auth-form-container">
                <a href="index.html" class="mobile-auth-logo">Pawfect Grooming</a>

                <div class="auth-heading">
                    <span class="auth-small-title">EMAIL VERIFICATION</span>
                    <h2>Check your inbox</h2>
                    <p>Enter the code sent to your email address.</p>
                </div>

                <form id="verifyEmailForm" class="auth-form">
                    <div class="form-group">
                        <label for="verificationEmail">Email Address</label>
                        <input
                            type="email"
                            id="verificationEmail"
                            name="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="verificationCode">Verification Code</label>
                        <input
                            type="text"
                            id="verificationCode"
                            name="verificationCode"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            placeholder="Enter your code"
                            maxlength="8"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-button">
                        Verify Email
                    </button>
                </form>

                <button type="button" id="resendCodeButton" class="auth-secondary-button">
                    Resend Code
                </button>

                <p class="auth-back">
                    <a href="register.html">← Back to registration</a>
                </p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
